<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#0b0d0c;overflow:hidden}</style></head>
<body><canvas id="v"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="crabmodel.js"></script>
<script>
var T=THREE, c=document.getElementById("v");
var r=new T.WebGLRenderer({canvas:c,antialias:true});
r.setSize(innerWidth,innerHeight); r.setClearColor(0x0b0d0c,1);
var sc=new T.Scene();
sc.add(new T.HemisphereLight(0x9fb3a6,0x1a201d,1.1));
var k=new T.DirectionalLight(0xe4ddca,1.3);k.position.set(-1,1.5,0.8);sc.add(k);
var rim=new T.DirectionalLight(0x5a8f86,0.7);rim.position.set(1.2,0.5,-1.1);sc.add(rim);
sc.add(new T.GridHelper(400,40,0x2a342e,0x161d19));
// mimic the designer heavy Leviathan: 4 x 305 centreline A/B/X/Y
var POS={A:{grp:"fore",zf:0.40,xf:0,tier:0,wing:false},
 B:{grp:"fore",zf:0.24,xf:0,tier:1,wing:false},
 X:{grp:"aft",zf:-0.24,xf:0,tier:1,wing:false},
 Y:{grp:"aft",zf:-0.40,xf:0,tier:0,wing:false},
 P:{grp:"wing",zf:0,xf:-0.46,tier:0,wing:true},
 S:{grp:"wing",zf:0,xf:0.46,tier:0,wing:true}};
var cls=(location.search.match(/cls=(\w+)/)||[])[1];
var spec;
if(cls){ // gallery default (legacy auto layout, with secondaries)
  var Lg={Recon:16,Skirmisher:22,Line:30,Carrier:40,Spider:34,Siege:54}[cls]||30;
  spec={chassisClass:cls,lengthM:Lg,team:"friend"};
}else{
  var which=(location.search.match(/g=([A-Z]+)/)||[])[1]||"ABXY";
  var mounts=which.split("").map(function(p){var d=POS[p];return{caliberMm:305,pos:p,grp:d.grp,zf:d.zf,xf:d.xf,tier:d.tier,wing:d.wing};});
  spec={chassisClass:"Siege",lengthM:46,mounts:mounts,positioned:true,modules:1,team:"friend"};
}
var m=CrabModel.build(spec); sc.add(m.group);
var L=m.lengthM;
var view=(location.search.match(/view=(\w+)/)||[])[1]||"side";
var cam=new T.PerspectiveCamera(34,innerWidth/innerHeight,0.1,3000);
if(view=="side"){cam.position.set(L*1.7,L*0.45,0.01);}
else if(view=="top"){cam.position.set(0.01,L*3.2,0.01);}
else {cam.position.set(L*1.2,L*0.7,L*1.4);}
cam.lookAt(0,L*0.18,0);
r.render(sc,cam);
</script></body></html>
