<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITY BATTLE // FIELD WIKI</title>
<style>
  :root{--bg:#0b0f0d;--panel:#12160f;--ink:#c9d3c4;--dim:#7a8b78;--hair:#2a352b;
    --teal:#57c7bd;--amber:#c8a24a;--red:#d75a52;--accent:#c8a24a}
  *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3a4a42 transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#3a4a42;border-radius:4px}
  ::-webkit-scrollbar-track{background:rgba(20,26,22,.4)}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"DejaVu Sans Mono",ui-monospace,monospace;
    display:flex;flex-direction:column}
  #bar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--hair);
    background:var(--panel);flex:0 0 auto}
  #bar .t{font-weight:bold;letter-spacing:.22em;color:var(--ink)}
  #bar .s{color:var(--dim);font-size:12px;letter-spacing:.08em}
  #bar a{margin-left:auto;color:var(--teal);text-decoration:none;font-size:12px;letter-spacing:.08em;
    border:1px solid var(--hair);padding:5px 12px}
  #bar a:hover{border-color:var(--teal)}
  #wrap{flex:1 1 auto;display:flex;min-height:0}
  #nav{flex:0 0 250px;border-right:1px solid var(--hair);overflow-y:auto;padding:14px 0;background:rgba(18,22,15,.5)}
  #nav .grp{color:var(--dim);font-size:10px;letter-spacing:.14em;padding:12px 16px 4px}
  #nav a{display:block;padding:7px 16px;color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.02em;border-left:2px solid transparent}
  #nav a:hover{background:rgba(120,140,110,.10)}
  #nav a.active{border-left-color:var(--amber);color:var(--amber);background:rgba(200,162,74,.08)}
  #doc{flex:1 1 auto;overflow-y:auto;padding:26px 40px 80px}
  #doc article{max-width:820px;margin:0 auto;line-height:1.65}
  #doc h1{color:var(--amber);letter-spacing:.06em;border-bottom:1px solid var(--hair);padding-bottom:10px;font-size:26px}
  #doc h2{color:var(--teal);margin-top:32px;font-size:19px;letter-spacing:.03em}
  #doc h3{color:var(--ink);margin-top:22px;font-size:15px;letter-spacing:.03em}
  #doc p,#doc li{color:var(--ink);font-size:14px}
  #doc a{color:var(--teal)}
  #doc code{background:rgba(90,110,90,.16);padding:1px 5px;border-radius:2px;font-size:13px;color:var(--amber)}
  #doc pre{background:#0e120d;border:1px solid var(--hair);padding:12px;overflow-x:auto;font-size:12.5px}
  #doc pre code{background:none;color:var(--ink)}
  #doc blockquote{border-left:3px solid var(--hair);margin:14px 0;padding:4px 14px;color:var(--dim)}
  #doc table{border-collapse:collapse;margin:14px 0;font-size:13px;width:100%}
  #doc th,#doc td{border:1px solid var(--hair);padding:6px 10px;text-align:left}
  #doc th{color:var(--dim);background:rgba(90,110,90,.08);font-weight:normal;letter-spacing:.04em}
  #doc hr{border:none;border-top:1px solid var(--hair);margin:24px 0}
  #doc strong{color:#e6ecdf}
  @media(max-width:720px){#nav{flex-basis:180px}#doc{padding:18px 18px 60px}}
</style>
</head>
<body>
<div id="bar">
  <span class="t">CITY BATTLE</span><span class="s">// FIELD WIKI</span>
  <a href="../index.html">&larr; TACTICAL MAP</a>
</div>
<div id="wrap">
  <nav id="nav"></nav>
  <div id="doc"><article id="art">Loading&hellip;</article></div>
</div>

<script>
// Wiki pages (order + display names). Chapters first, then reference dossiers.
var PAGES = [
  ["00_INDEX",              "Index / Overview",       "GUIDE"],
  ["01_FIRE_AND_BALLISTICS","Fire & Ballistics",      "GUIDE"],
  ["02_CRAB_DESIGN",        "Crab Design (Foundry)",  "GUIDE"],
  ["03_COMBAT",             "Combat",                 "GUIDE"],
  ["04_RESEARCH",           "Research",               "GUIDE"],
  ["05_CAMPAIGN",           "Campaign",               "GUIDE"],
  ["06_MAP",                "Map & Terrain",          "GUIDE"],
  ["07_GLOSSARY",           "Glossary",               "GUIDE"],
  ["ref/ARTILLERY_DOCTRINE","Artillery Doctrine (ref)","REFERENCE"]
];

// --- tiny, safe-ish Markdown -> HTML renderer (headings, lists, tables, code, links, bold/italic) ---
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(m,t,h){
      // internal .md links -> switch page; external -> new tab
      var mmd=h.match(/^(?:\.\/)?([\w/]+)\.md(?:#.*)?$/);
      if(mmd) return '<a href="#'+mmd[1].replace(/^\.\//,"")+'">'+t+'</a>';
      return '<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>';
    });
}
function mdToHtml(md){
  var lines=md.replace(/\r/g,"").split("\n"), out=[], i=0;
  function flushList(tag,items){ out.push("<"+tag+">"+items.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</"+tag+">"); }
  while(i<lines.length){
    var ln=lines[i];
    if(/^```/.test(ln)){ var buf=[]; i++; while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;} i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue; }
    if(/^\s*$/.test(ln)){ i++; continue; }
    var h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){ var lvl=h[1].length; out.push("<h"+lvl+">"+inline(h[2])+"</h"+lvl+">"); i++; continue; }
    if(/^\s*>/.test(ln)){ var q=[]; while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;} out.push("<blockquote>"+inline(q.join(" "))+"</blockquote>"); continue; }
    if(/^\s*\|/.test(ln)&&/\|/.test(lines[i+1]||"")&&/^[\s|:-]+$/.test(lines[i+1])){
      var rows=[]; while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var cells=function(r){return r.trim().replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim();});};
      var head=cells(rows[0]); var body=rows.slice(2).map(cells);
      var t="<table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr></thead><tbody>";
      t+=body.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+inline(c)+"</td>";}).join("")+"</tr>";}).join("");
      out.push(t+"</tbody></table>"); continue;
    }
    if(/^[-*]\s+/.test(ln)){ var items=[]; while(i<lines.length&&/^[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^[-*]\s+/,""));i++;} flushList("ul",items); continue; }
    if(/^\d+\.\s+/.test(ln)){ var it2=[]; while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){it2.push(lines[i].replace(/^\d+\.\s+/,""));i++;} flushList("ol",it2); continue; }
    if(/^---+$/.test(ln)){ out.push("<hr>"); i++; continue; }
    var para=[ln]; i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,4}\s|[-*]\s|\d+\.\s|>|\||```|---+$)/.test(lines[i])){para.push(lines[i]);i++;}
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  return out.join("\n");
}

function buildNav(){
  var nav=document.getElementById("nav"), lastGrp="";
  PAGES.forEach(function(p){
    if(p[2]!==lastGrp){ lastGrp=p[2]; var g=document.createElement("div"); g.className="grp"; g.textContent=p[2]; nav.appendChild(g); }
    var a=document.createElement("a"); a.href="#"+p[0]; a.textContent=p[1]; a.dataset.id=p[0]; nav.appendChild(a);
  });
}
function setActive(id){
  document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("active",a.dataset.id===id);});
}
function load(id){
  if(!id) id="00_INDEX";
  setActive(id);
  fetch("md/"+id+".md").then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
    .then(function(md){ document.getElementById("art").innerHTML=mdToHtml(md); document.getElementById("doc").scrollTop=0; })
    .catch(function(e){ document.getElementById("art").innerHTML="<p style='color:var(--red)'>Could not load "+id+" ("+e+")</p>"; });
}
window.addEventListener("hashchange",function(){load(location.hash.slice(1));});
buildNav();
load(location.hash.slice(1));
</script>
</body>
</html>
